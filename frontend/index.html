<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - SwingEdge Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <i class="fas fa-bolt text-blue"></i> SwingEdge<span>Pro</span>
      </div>
      <div class="nav-menu">
        <a href="index.html" class="nav-item active" id="nav-dashboard"><i class="fas fa-home"></i> Dashboard</a>
        <a href="screener.html" class="nav-item" id="nav-screener"><i class="fas fa-filter"></i> Screener</a>
        <a href="sectors.html" class="nav-item" id="nav-sectors"><i class="fas fa-chart-pie"></i> Sectors</a>
        <a href="intelligence.html" class="nav-item" id="nav-intelligence"><i class="fas fa-globe"></i> Intelligence</a>
        <a href="backtest.html" class="nav-item" id="nav-backtest"><i class="fas fa-vial"></i> Backtest Lab</a>
        <a href="portfolio.html" class="nav-item" id="nav-portfolio"><i class="fas fa-briefcase"></i> Watchlist</a>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-wrapper">
      <!-- Topbar -->
      <div class="topbar">
        <div class="pulse-strip" id="market-pulse-strip">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Dashboard Content -->
      <div class="content-area">
        <div style="margin-bottom: 24px; display:flex; justify-content:space-between; align-items:center;">
          <h2>Market Overview</h2>
          <button class="btn btn-primary"><i class="fas fa-sync"></i> Refresh</button>
        </div>

        <div class="grid grid-cols-12 gap-4">
          <!-- Sectors Heatmap (Span 4) -->
          <div class="col-span-4 card">
            <h3 style="margin-bottom: 16px;">Sector Heatmap</h3>
            <div class="grid grid-cols-2" id="sector-grid">
              <!-- Populated by JS -->
            </div>
          </div>

          <!-- Top Signals (Span 8) -->
          <div class="col-span-8 card">
            <h3 style="margin-bottom: 16px;">Top Swing Signals</h3>
            <div class="table-container">
              <table>
                <thead>
                  <tr><th>Ticker</th><th>Price</th><th>Score</th><th>Pattern</th><th>Trend</th><th>Action</th></tr>
                </thead>
                <tbody id="top-signals-tbody">
                  <!-- Populated by JS -->
                </tbody>
              </table>
            </div>
          </div>

          <!-- Intelligence (Span 8) -->
          <div class="col-span-8 card mt-4">
            <h3 style="margin-bottom: 16px;"><i class="fas fa-globe text-blue"></i> Global Intelligence Impact</h3>
            <div id="intelligence-feed">
              <!-- Populated by JS -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
