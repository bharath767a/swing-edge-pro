<body>
  <div class="app-container">
    <div class="sidebar">

                <td>$118.45 <span class="text-green">+3.2%</span></td>
                <td class="text-green">$130.00</td>
                <td class="text-red">$110.00</td>
                <td class="text-secondary">VCP Breakout</td>
                <td><button class="btn btn-secondary"><i class="fas fa-trash text-red"></i></button></td>
