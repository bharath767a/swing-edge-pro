name: CI

on:
  push:
    branches: [main, master, audit-fixes-and-upgrades]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff bandit

      - name: Lint with ruff
        run: |
          ruff check backend/ --exit-zero --output-format=github || true
          # Don't fail CI on lint warnings — just report

      - name: Security scan with bandit
        run: |
          bandit -r backend/ -ll || true
          # Don't fail CI on security warnings — just report

      - name: Run tests with coverage
        env:
          # Provide empty test env vars so config.py doesn't complain
          FINNHUB_API_KEY: ''
          ALPHA_VANTAGE_KEY: ''
          NEWS_API_KEY: ''
          FRED_API_KEY: ''
          REDDIT_CLIENT_ID: ''
          REDDIT_CLIENT_SECRET: ''
        run: |
          pytest tests/ -v --cov=backend --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t swingedge-pro:ci .

      - name: Verify image runs
        run: |
          docker run -d --name test-container -p 8001:8000 swingedge-pro:ci
          sleep 10
          curl -sf http://localhost:8001/api/health | python -c "import sys, json; d=json.load(sys.stdin); assert d['status']=='healthy'"
          docker stop test-container
